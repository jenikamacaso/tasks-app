<div class="container py-4 px-20">
  <div class="row g-2 mb-3">
    <div class="col-12">
      <div class="search-wrapper">
        <i class="fa-solid fa-magnifying-glass search-icon"></i>

        <input
          type="text"
          class="search-input"
          placeholder="Search"
          [ngModel]="store.search()"
          (ngModelChange)="store.search.set($event)"
        />
      </div>
    </div>
  </div>

  <div class="row g-2 mb-3 align-items-center justify-content-end">
    <div class="col-12 col-md-6 col-lg-4 d-flex align-items-center">
      <p class="mb-0 me-2 d-none d-md-block w-100 text-end">Sort by:</p>
      <select
        class="form-select"
        [ngModel]="store.sortField()"
        (ngModelChange)="store.setSortField($event)"
      >
        <option value="title">Title (A → Z)</option>
        <option value="createdAt">Created Date (Old → New)</option>
      </select>
    </div>

    <div class="col-12 col-md-2 col-lg-2 d-grid">
      <button class="btn btn-primary" (click)="openAdd()">Add Task</button>
    </div>
  </div>

  <!-- Task List -->
  <div class="row g-3">
    <div class="col-12" *ngFor="let task of store.paginatedTasks()">
      <div class="card p-3 shadow-sm">
        <!-- Title -->
        <h5 class="mb-1">{{ task.title }}</h5>

        <!-- Description -->
        <p class="text-muted small mt-2">{{ task.description }}</p>

        <!-- Badge -->
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span
            class="badge d-inline-block"
            [class.bg-success]="task.status === 'Done'"
            [class.bg-warning]="task.status === 'In Progress'"
            [class.bg-secondary]="task.status === 'Pending'"
          >
            {{ task.status }}
          </span>

          <!-- Details button -->
          <button class="btn btn-sm btn-outline-primary" (click)="goToDetails(task.id)">
            Details
          </button>
        </div>
      </div>
    </div>

    <!-- Pagination -->
    <nav class="mt-4 d-flex justify-content-end" *ngIf="store.totalPages() > 1">
      <ul class="pagination custom-pagination mb-0">
        <!-- Previous arrow -->
        <li class="page-item" [class.disabled]="store.page() === 1">
          <button class="page-link arrow-btn" (click)="store.page.set(store.page() - 1)">‹</button>
        </li>

        <!-- Page numbers -->
        <li *ngFor="let p of [].constructor(store.totalPages()); let i = index" class="page-item">
          <button
            class="page-link page-number"
            [class.active]="store.page() === i + 1"
            (click)="store.page.set(i + 1)"
          >
            {{ i + 1 }}
          </button>
        </li>

        <!-- Next arrow -->
        <li class="page-item" [class.disabled]="store.page() === store.totalPages()">
          <button class="page-link arrow-btn" (click)="store.page.set(store.page() + 1)">›</button>
        </li>
      </ul>
    </nav>
  </div>
</div>
