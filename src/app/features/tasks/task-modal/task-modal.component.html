<div class="container py-4">
  <div class="card p-4 shadow-sm">
    <h3>{{ editMode ? 'Edit Task' : 'Add Task' }}</h3>
    <form #taskForm="ngForm">
      <div class="mt-3">
        <label class="form-label">Title</label>
        <input
          type="text"
          class="form-control"
          name="title"
          [(ngModel)]="task.title"
          required
          #title="ngModel"
        />
        <div class="text-danger mt-1" *ngIf="title.invalid && title.touched">
          Title is required.
        </div>
      </div>

      <div class="mt-3">
        <label class="form-label">Description</label>
        <textarea rows="4" class="form-control" [(ngModel)]="task.description" name="description"></textarea>
      </div>

      <div class="mt-3">
        <label>Status</label>
        <select class="form-select" [(ngModel)]="task.status" name="status">
          <option value="Pending">Pending</option>
          <option value="In Progress">In Progress</option>
          <option value="Done">Done</option>
        </select>
      </div>

      <div class="mt-4">
        <button class="btn btn-light" (click)="cancel()">Cancel</button>
        <button class="btn btn-primary ms-2" (click)="save()">Save</button>
      </div>
    </form>
  </div>
</div>
