<div class="container py-4">
  <div class="card p-4 shadow-sm">
    <h3>{{ editMode ? 'Edit Task' : 'Add Task' }}</h3>

    <div class="mt-3">
      <label class="form-label">Title</label>
      <input type="text" class="form-control" [(ngModel)]="task.title" />
    </div>

    <div class="mt-3">
      <label class="form-label">Description</label>
      <textarea rows="4" class="form-control" [(ngModel)]="task.description"></textarea>
    </div>

    <div class="mt-3">
      <label>Status</label>
      <select class="form-select" [(ngModel)]="task.status">
        <option value="pending">Pending</option>
        <option value="in-progress">In Progress</option>
        <option value="done">Done</option>
      </select>
    </div>

    <div class="mt-4">
      <button class="btn btn-secondary" routerLink="/">Cancel</button>
      <button class="btn btn-primary ms-2" (click)="save()">Save</button>
    </div>
  </div>
</div>
