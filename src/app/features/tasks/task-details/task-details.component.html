<div class="container py-4" *ngIf="task">
  <button class="btn btn-link" (click)="goBack()">← Back</button>

  <div class="card p-4 shadow-sm">
    <!-- Title -->
    <h3>{{ task.title }}</h3>

    <!-- Status badge -->
    <div class="d-flex justify-content-between align-items-center mb-2">
      <span
        class="badge d-inline-block mt-2"
        [class.bg-success]="task.status === 'Done'"
        [class.bg-warning]="task.status === 'In Progress'"
        [class.bg-secondary]="task.status === 'Pending'"
      >
        {{ task.status }}
      </span>
    </div>

    <!-- Description -->
    <p class="mt-3">{{ task.description }}</p>

    <!-- Created at -->
    <p class="text-muted">Created at: {{ task.createdAt | date : 'medium' }}</p>

    <!-- Actions -->
    <div class="mt-3">
      <button class="btn btn-primary me-2" (click)="edit()">Edit</button>
      <button class="btn btn-danger" (click)="deleteTask()">Delete</button>
    </div>
  </div>
</div>
